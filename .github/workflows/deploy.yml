name: Deploy

# 2026-09-10 이전 완료 구성:
#   - 본 사이트: Cloudflare Pages (moneyradar-blog → money-radar.kr)
#   - GitHub Pages(moneyradar.github.io): redirect/ 폴더만 올려 모든 경로를 money-radar.kr 로 넘긴다
#     (GitHub Pages 는 서버 301 이 없어 404.html JS 리다이렉트 + canonical 로 대신한다)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
      # 글마다 200 응답 리다이렉트 페이지 생성 (404.html 은 미생성 경로용 안전망)
      - run: node scripts/make-redirects.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

  deploy-cloudflare-pages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name moneyradar-blog --branch main

  deploy-github-pages-redirect:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
